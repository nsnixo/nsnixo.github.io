<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grocery List</title>

    <style>
        /* ================================
           GLOBAL
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ================================
           MAIN APP
        ================================= */

        .app {
            width: min(1100px, 94%);
            margin: 35px auto;
        }

        /* ================================
           HEADER
        ================================= */

        .header {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        /* ================================
           PANELS
        ================================= */

        .panel {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            margin-bottom: 20px;
        }

        .panel h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        /* ================================
           ADD ITEM FORM
        ================================= */

        .form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            background: white;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #555;
        }

        button {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: bold;
        }

        .add-button {
            background: #222;
            color: white;
        }

        .add-button:hover {
            background: #000;
        }

        .secondary-button {
            background: #eeeeee;
            color: #222;
        }

        .secondary-button:hover {
            background: #e1e1e1;
        }

        .danger-button {
            background: #ffe5e5;
            color: #b00020;
        }

        .danger-button:hover {
            background: #ffd3d3;
        }

        /* ================================
           TOOLBAR
        ================================= */

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        .filter-box {
            width: 180px;
        }

        /* ================================
           TABLE
        ================================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 13px 10px;
            border-bottom: 2px solid #eee;
            color: #777;
            font-size: 13px;
            font-weight: bold;
        }

        td {
            padding: 14px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #fafafa;
        }

        /* ================================
           CHECKBOX
        ================================= */

        .check {
            width: 19px;
            height: 19px;
            cursor: pointer;
        }

        /* ================================
           PURCHASED
        ================================= */

        tr.purchased td {
            color: #999;
            text-decoration: line-through;
        }

        tr.purchased .actions button {
            text-decoration: none;
        }

        /* ================================
           ACTIONS
        ================================= */

        .actions {
            display: flex;
            gap: 6px;
        }

        .delete-button {
            padding: 8px 11px;
            font-size: 12px;
        }

        /* ================================
           EMPTY MESSAGE
        ================================= */

        .empty {
            text-align: center;
            color: #888;
            padding: 40px 20px;
            font-size: 15px;
        }

        /* ================================
           SUMMARY
        ================================= */

        .summary {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 35px;
            padding-top: 20px;
        }

        .summary-item {
            font-size: 16px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 800px) {

            .form {
                grid-template-columns: 1fr 1fr;
            }

            .form .item-name {
                grid-column: 1 / -1;
            }

            .form .add-button {
                grid-column: 1 / -1;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box,
            .filter-box {
                width: 100%;
            }

            .summary {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        @media (max-width: 500px) {

            .app {
                width: 96%;
                margin: 15px auto;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .panel {
                padding: 16px;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .form .item-name,
            .form .add-button {
                grid-column: auto;
            }

            th,
            td {
                padding: 10px 7px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">
        <h1>🛒 Grocery List</h1>

        <p>
            Add the things you need to buy and keep track of your shopping.
        </p>
    </header>


    <!-- ================================
         ADD ITEM
    ================================= -->

    <section class="panel">

        <h2>Add Grocery Item</h2>

        <div class="form">

            <!-- Item -->
            <input
                id="itemName"
                class="item-name"
                type="text"
                placeholder="Item name (e.g. Rice)"
            >

            <!-- Quantity -->
            <input
                id="quantity"
                type="number"
                min="0"
                step="0.01"
                placeholder="Quantity"
            >

            <!-- Unit -->
            <select id="unit">

                <option value="pcs">pcs</option>
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="litre">litre</option>
                <option value="ml">ml</option>
                <option value="dozen">dozen</option>
                <option value="packet">packet</option>
                <option value="bottle">bottle</option>
                <option value="box">box</option>
                <option value="pack">pack</option>

            </select>

            <!-- Price -->
            <input
                id="price"
                type="number"
                min="0"
                step="0.01"
                placeholder="Price"
            >

            <!-- Add -->
            <button
                class="add-button"
                onclick="addItem()"
            >
                + Add
            </button>

        </div>

    </section>


    <!-- ================================
         GROCERY LIST
    ================================= -->

    <section class="panel">

        <!-- Toolbar -->

        <div class="toolbar">

            <!-- Search -->
            <input
                id="search"
                class="search-box"
                type="text"
                placeholder="🔍 Search groceries..."
                oninput="render()"
            >

            <!-- Filter -->
            <select
                id="filter"
                class="filter-box"
                onchange="render()"
            >

                <option value="all">
                    All Items
                </option>

                <option value="pending">
                    Not Purchased
                </option>

                <option value="purchased">
                    Purchased
                </option>

            </select>

            <!-- Clear Purchased -->
            <button
                class="secondary-button"
                onclick="clearPurchased()"
            >
                Clear Purchased
            </button>

            <!-- Clear All -->
            <button
                class="danger-button"
                onclick="clearAll()"
            >
                Clear All
            </button>

        </div>


        <!-- Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ✓
                        </th>

                        <th>
                            Item
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Unit
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="list">
                    <!-- Items will appear here -->
                </tbody>

            </table>

        </div>


        <!-- Empty -->

        <div
            id="empty"
            class="empty"
        >
            No grocery items yet.
            Add your first item above.
        </div>


        <!-- Summary -->

        <div class="summary">

            <div class="summary-item">
                Items:
                <strong id="count">0</strong>
            </div>

            <div class="total">
                Total:
                Rs.
                <span id="total">
                    0.00
                </span>
            </div>

        </div>

    </section>

</div>


<script>

    /* ==========================================
       LOAD SAVED ITEMS
    ========================================== */

    let items = JSON.parse(
        localStorage.getItem("groceryItems") || "[]"
    );


    /* ==========================================
       SAVE ITEMS
    ========================================== */

    function saveItems() {

        localStorage.setItem(
            "groceryItems",
            JSON.stringify(items)
        );

    }


    /* ==========================================
       ADD ITEM
    ========================================== */

    function addItem() {

        const nameInput =
            document.getElementById("itemName");

        const quantityInput =
            document.getElementById("quantity");

        const unitInput =
            document.getElementById("unit");

        const priceInput =
            document.getElementById("price");


        const name =
            nameInput.value.trim();

        const quantity =
            Number(quantityInput.value);

        const unit =
            unitInput.value;

        const price =
            Number(priceInput.value);


        /* Check item name */

        if (!name) {

            alert(
                "Please enter the item name."
            );

            nameInput.focus();

            return;
        }


        /* Create item */

        const newItem = {

            id: Date.now(),

            name: name,

            quantity:
                quantity > 0
                    ? quantity
                    : 1,

            unit: unit,

            price:
                price >= 0
                    ? price
                    : 0,

            purchased: false

        };


        /* Add to array */

        items.push(newItem);


        /* Save */

        saveItems();


        /* Clear form */

        nameInput.value = "";

        quantityInput.value = "";

        priceInput.value = "";


        /* Refresh */

        render();


        /* Focus name */

        nameInput.focus();

    }


    /* ==========================================
       DELETE ITEM
    ========================================== */

    function deleteItem(id) {

        items = items.filter(
            item => item.id !== id
        );


        saveItems();

        render();

    }


    /* ==========================================
       PURCHASE TOGGLE
    ========================================== */

    function togglePurchased(id) {

        const item =
            items.find(
                item => item.id === id
            );


        if (item) {

            item.purchased =
                !item.purchased;

        }


        saveItems();

        render();

    }


    /* ==========================================
       CLEAR PURCHASED
    ========================================== */

    function clearPurchased() {

        items =
            items.filter(
                item => !item.purchased
            );


        saveItems();

        render();

    }


    /* ==========================================
       CLEAR ALL
    ========================================== */

    function clearAll() {

        if (items.length === 0) {
            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to delete the entire grocery list?"
            );


        if (!confirmed) {
            return;
        }


        items = [];


        saveItems();

        render();

    }


    /* ==========================================
       RENDER LIST
    ========================================== */

    function render() {

        const searchInput =
            document.getElementById("search");

        const filterInput =
            document.getElementById("filter");

        const list =
            document.getElementById("list");

        const empty =
            document.getElementById("empty");

        const count =
            document.getElementById("count");

        const total =
            document.getElementById("total");


        const search =
            searchInput.value
                .toLowerCase()
                .trim();

        const filter =
            filterInput.value;


        /* Filter items */

        const visibleItems =
            items.filter(item => {

                const matchesSearch =
                    item.name
                        .toLowerCase()
                        .includes(search);


                let matchesFilter = true;


                if (
                    filter === "purchased"
                ) {

                    matchesFilter =
                        item.purchased === true;

                }


                if (
                    filter === "pending"
                ) {

                    matchesFilter =
                        item.purchased === false;

                }


                return (
                    matchesSearch &&
                    matchesFilter
                );

            });


        /* Clear table */

        list.innerHTML = "";


        /* Display items */

        visibleItems.forEach(item => {

            const row =
                document.createElement("tr");


            if (item.purchased) {

                row.classList.add(
                    "purchased"
                );

            }


            const itemTotal =
                item.quantity *
                item.price;


            row.innerHTML = `

                <td>

                    <input
                        class="check"
                        type="checkbox"

                        ${
                            item.purchased
                                ? "checked"
                                : ""
                        }

                        onchange="
                            togglePurchased(
                                ${item.id}
                            )
                        "
                    >

                </td>


                <td>
                    ${escapeHTML(item.name)}
                </td>


                <td>
                    ${item.quantity}
                </td>


                <td>
                    ${escapeHTML(item.unit)}
                </td>


                <td>
                    Rs.
                    ${formatMoney(item.price)}
                </td>


                <td>
                    Rs.
                    ${formatMoney(itemTotal)}
                </td>


                <td>

                    <div class="actions">

                        <button
                            class="
                                danger-button
                                delete-button
                            "

                            onclick="
                                deleteItem(
                                    ${item.id}
                                )
                            "
                        >
                            Delete
                        </button>

                    </div>

                </td>

            `;


            list.appendChild(row);

        });


        /* Empty message */

        if (
            visibleItems.length === 0
        ) {

            empty.style.display =
                "block";

        } else {

            empty.style.display =
                "none";

        }


        /* Item count */

        count.textContent =
            items.length;


        /* Calculate total */

        const grandTotal =
            items.reduce(
                (sum, item) => {

                    return (
                        sum +
                        (
                            item.quantity *
                            item.price
                        )
                    );

                },
                0
            );


        total.textContent =
            formatMoney(grandTotal);

    }


    /* ==========================================
       MONEY FORMAT
    ========================================== */

    function formatMoney(number) {

        return Number(number)
            .toLocaleString(
                "en-PK",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

    }


    /* ==========================================
       HTML SECURITY
    ========================================== */

    function escapeHTML(value) {

        return String(value)
            .replace(
                /[&<>"']/g,
                function(character) {

                    const entities = {

                        "&": "&amp;",

                        "<": "&lt;",

                        ">": "&gt;",

                        '"': "&quot;",

                        "'": "&#039;"

                    };

                    return entities[
                        character
                    ];

                }
            );

    }


    /* ==========================================
       ENTER KEY
    ========================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                (
                    document.activeElement.id ===
                    "itemName" ||

                    document.activeElement.id ===
                    "quantity" ||

                    document.activeElement.id ===
                    "price"
                )
            ) {

                addItem();

            }

        }
    );


    /* ==========================================
       INITIAL LOAD
    ========================================== */

    render();

</script>

</body>
</html>
